name: Latest posts

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rewrite the posts list from the blog's RSS feed
        shell: python
        run: |
          import re, urllib.request, xml.etree.ElementTree as ET
          feed = ET.fromstring(urllib.request.urlopen("https://blog.devpand.com/rss.xml", timeout=30).read())
          items = feed.findall("./channel/item")[:5]
          lines = "\n".join(f"- [{i.findtext('title')}]({i.findtext('link')})" for i in items)
          readme = open("README.md").read()
          readme = re.sub(r"(<!-- posts:start -->).*?(<!-- posts:end -->)", lambda m: f"{m[1]}\n{lines}\n{m[2]}", readme, flags=re.S)
          open("README.md", "w").write(readme)
      - name: Commit if changed
        run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update latest posts"
          git push
